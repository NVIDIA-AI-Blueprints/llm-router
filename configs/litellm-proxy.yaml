# LiteLLM Proxy config for use with Docker and model-router proxy mode.
# Generated from configs/prefill-qwen08b.yaml via:
#   model-router proxy-config --config configs/prefill-qwen08b.yaml
#
# API keys are resolved from environment variables at runtime.
# Set OPENROUTER_API_KEY (or NVIDIA_API_KEY for NIM configs) before starting.

model_list:
  - model_name: nem-think
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-30b-a3b
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: nem-nothink
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-30b-a3b
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gptoss-high
    litellm_params:
      model: openrouter/openai/gpt-oss-20b
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gpt-5.2
    litellm_params:
      model: openrouter/openai/gpt-5.2
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  routing_strategy: simple-shuffle
