routing:
  method: kmeans
  checkpoint: checkpoints/kmeans_c100_db.pkl
  tolerance: 0.20
  embed_model: nvidia/llama-nemotron-embed-1b-v2
  embed_mode: api
  embed_api_base: https://integrate.api.nvidia.com/v1

models:
  - name: nem-think
    display_name: Nemotron 3 Nano Think
    litellm_model: nvidia_nim/nvidia/nvidia/Nemotron-3-Nano-30B-A3B
    cost_per_m_input_tokens: 0.20
    cost_per_m_output_tokens: 0.20
    system_prompt: "Think step-by-step before answering."
    chat_template_kwargs:
      enable_thinking: true

  - name: nem-super
    display_name: Nemotron 3 Super
    litellm_model: nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
    cost_per_m_input_tokens: 0.30
    cost_per_m_output_tokens: 0.30

  - name: gptoss-20b
    display_name: GPT-OSS 20B
    litellm_model: nvidia_nim/nvidia/openai/gpt-oss-20b
    cost_per_m_input_tokens: 0.30
    cost_per_m_output_tokens: 0.30
    chat_template_kwargs:
      reasoning_effort: high

  - name: gptoss-120b
    display_name: GPT-OSS 120B
    litellm_model: nvidia_nim/openai/gpt-oss-120b
    cost_per_m_input_tokens: 1.00
    cost_per_m_output_tokens: 1.00

  - name: qwen-122b
    display_name: Qwen 3.5 122B
    litellm_model: nvidia_nim/qwen/qwen3.5-122b-a10b
    cost_per_m_input_tokens: 0.50
    cost_per_m_output_tokens: 0.50

  - name: gpt-5.2
    display_name: GPT-5.2
    litellm_model: nvidia_nim/openai/openai/gpt-5.2
    cost_per_m_input_tokens: 1.75
    cost_per_m_output_tokens: 14.00

  - name: claude-opus
    display_name: Claude Opus 4.6
    litellm_model: nvidia_nim/aws/anthropic/bedrock-claude-opus-4-6
    cost_per_m_input_tokens: 5.00
    cost_per_m_output_tokens: 25.00
