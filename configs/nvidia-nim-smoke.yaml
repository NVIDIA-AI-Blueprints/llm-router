# 4-model config targeting REDACTED_INTERNAL_ENDPOINT (NVIDIA Inference API).
# Uses prefill_qwen08b.pt checkpoint (trained on: nem-think, nem-nothink, gptoss-high, gpt-5.2).
# Set NVIDIA_INTERNAL_API_KEY_REDACTED (sk-...) before serving.
routing:
  method: prefill
  checkpoint: checkpoints/prefill_qwen08b.pt
  tolerance: 0.20
  encoder: Qwen/Qwen3.5-0.8B
  encoder_backend: transformers

models:
  - name: nem-think
    display_name: Nemotron 3 Nano Think
    litellm_model: openai/nvidia/nvidia/Nemotron-3-Nano-30B-A3B
    cost_per_m_input_tokens: 0.20
    cost_per_m_output_tokens: 0.20
    api_base: https://REDACTED_INTERNAL_ENDPOINT/v1
    system_prompt: Think step-by-step before answering.
    chat_template_kwargs:
      enable_thinking: true

  - name: nem-nothink
    display_name: Nemotron 3 Nano
    litellm_model: openai/nvidia/nvidia/Nemotron-3-Nano-30B-A3B
    cost_per_m_input_tokens: 0.04
    cost_per_m_output_tokens: 0.16
    api_base: https://REDACTED_INTERNAL_ENDPOINT/v1
    system_prompt: Answer directly and concisely.

  - name: gptoss-high
    display_name: GPT-OSS 20B
    litellm_model: openai/nvidia/openai/gpt-oss-20b
    cost_per_m_input_tokens: 0.30
    cost_per_m_output_tokens: 0.30
    api_base: https://REDACTED_INTERNAL_ENDPOINT/v1
    chat_template_kwargs:
      reasoning_effort: high

  - name: gpt-5.2
    display_name: GPT-5.2
    litellm_model: azure/openai/gpt-5.2
    cost_per_m_input_tokens: 5.00
    cost_per_m_output_tokens: 25.00
    api_base: https://REDACTED_INTERNAL_ENDPOINT/v1
