routing:
  method: prefill
  checkpoint: checkpoints/prefill.pt
  tolerance: 0.20
  encoder: Qwen/Qwen3.5-35B-A3B
  encoder_server: http://localhost:8421
  training_mode: auto

models:
  - name: qwen-35b
    display_name: Qwen 3.5 35B (Local)
    litellm_model: openai/vllm/Qwen/Qwen3.5-35B-A3B
    api_base: http://localhost:8000
    cost_per_m_input_tokens: 0.00
    cost_per_m_output_tokens: 0.00

  - name: nem-think
    display_name: Nemotron 3 Nano Think
    litellm_model: openrouter/nvidia/nvidia-nemotron-3-nano-30b-a3b
    cost_per_m_input_tokens: 0.20
    cost_per_m_output_tokens: 0.20
    system_prompt: "Think step-by-step before answering."
    chat_template_kwargs:
      enable_thinking: true

  - name: nem-super
    display_name: Nemotron 3 Super
    litellm_model: openrouter/nvidia/llama-3.3-nemotron-super-49b-v1.5
    cost_per_m_input_tokens: 0.30
    cost_per_m_output_tokens: 0.30

  - name: gptoss-20b
    display_name: GPT-OSS 20B
    litellm_model: openrouter/nvidia/openai-gpt-oss-20b
    cost_per_m_input_tokens: 0.30
    cost_per_m_output_tokens: 0.30
    chat_template_kwargs:
      reasoning_effort: high

  - name: gptoss-120b
    display_name: GPT-OSS 120B
    litellm_model: openrouter/openai/gpt-oss-120b
    cost_per_m_input_tokens: 1.00
    cost_per_m_output_tokens: 1.00

  - name: qwen-122b
    display_name: Qwen 3.5 122B
    litellm_model: openrouter/qwen/qwen3.5-122b-a10b
    cost_per_m_input_tokens: 0.50
    cost_per_m_output_tokens: 0.50

  - name: gpt-5.2
    display_name: GPT-5.2
    litellm_model: openrouter/openai/gpt-5.2
    cost_per_m_input_tokens: 1.75
    cost_per_m_output_tokens: 14.00

  - name: claude-opus
    display_name: Claude Opus 4.6
    litellm_model: openrouter/anthropic/claude-opus-4-20250514
    cost_per_m_input_tokens: 5.00
    cost_per_m_output_tokens: 25.00
