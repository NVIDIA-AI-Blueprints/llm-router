# Prefill routing with Qwen3.5-0.8B encoder (default config).
# Uses OpenRouter for model inference. Set OPENROUTER_API_KEY before serving.
routing:
  method: prefill
  checkpoint: checkpoints/prefill_qwen08b.pt # trained router checkpoint
  tolerance: 0.20                            # accuracy-cost tradeoff (0=cheapest, 1=best)
  encoder: Qwen/Qwen3.5-0.8B                # HF model for prefill feature extraction
  encoder_backend: transformers              # transformers (local) or server (remote)

models:
  - name: nem-think
    display_name: Nemotron 3 Nano Think
    litellm_model: openrouter/nvidia/nemotron-3-nano-30b-a3b
    cost_per_m_input_tokens: 0.20
    cost_per_m_output_tokens: 0.20
    system_prompt: Think step-by-step before answering.
    chat_template_kwargs:
      enable_thinking: true

  - name: nem-nothink
    display_name: Nemotron 3 Nano
    litellm_model: openrouter/nvidia/nemotron-3-nano-30b-a3b
    cost_per_m_input_tokens: 0.04
    cost_per_m_output_tokens: 0.16
    system_prompt: Answer directly and concisely.

  - name: gptoss-high
    display_name: GPT-OSS 20B
    litellm_model: openrouter/openai/gpt-oss-20b
    cost_per_m_input_tokens: 0.30
    cost_per_m_output_tokens: 0.30
    chat_template_kwargs:
      reasoning_effort: high

  - name: gpt-5.2
    display_name: GPT-5.2
    litellm_model: openrouter/openai/gpt-5.2
    cost_per_m_input_tokens: 1.75
    cost_per_m_output_tokens: 14.00
