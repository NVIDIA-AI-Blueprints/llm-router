[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router-toolkit"
version = "0.1.0"
description = "LLM routing toolkit: learns which model handles which queries best, routes to the cheapest model above an accuracy threshold"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "NVIDIA Corporation"}]
requires-python = ">=3.10"
keywords = ["llm", "routing", "model-selection", "cost-optimization", "litellm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "requests>=2.28",
    "pyyaml>=6.0",
    "litellm>=1.50,<2.0",
    "fastapi>=0.100",
    "uvicorn>=0.22",
]

[project.urls]
Repository = "https://github.com/NVIDIA/model-router-toolkit"
Documentation = "https://github.com/NVIDIA/model-router-toolkit/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "ruff>=0.1",
    "mypy>=1.0",
]
prefill = [
    "torch>=2.0",
    "transformers>=4.45",
    "accelerate>=0.20",
    "tqdm>=4.60",
]
proxy = [
    "litellm[proxy]>=1.50,<2.0",
    "packaging>=20.0",
]

[project.scripts]
model-router = "model_router_toolkit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.isort]
known-first-party = ["model_router_toolkit"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "requires_nvidia_api_key: skip when NVIDIA_API_KEY is not set",
    "requires_openrouter_api_key: skip when OPENROUTER_API_KEY is not set",
    "requires_torch: skip when torch is not installed",
    "requires_encoder: skip when Qwen/Qwen3.5-0.8B encoder is not cached",
    "slow: marks tests needing encoder model or API keys (deselected by default, use --run-slow)",
]
