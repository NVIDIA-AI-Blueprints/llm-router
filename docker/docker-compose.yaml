services:
  model-router-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: proxy-gpu
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ../configs:/app/configs:ro
      - ../checkpoints:/app/checkpoints:ro
    environment:
      LITELLM_CONFIG: /app/configs/litellm-proxy.yaml
      ROUTER_CONFIG: /app/configs/prefill-qwen08b.yaml
      HOST: "0.0.0.0"
      PORT: "4000"
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
