name: Documentation Request
description: Request corrections, updates, or new documentation
title: "[DOC]: "
labels: ["doc"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to improve our documentation!

  - type: dropdown
    id: request_type
    attributes:
      label: Is this a correction or a new documentation request?
      options:
        - Correction / Update
        - New Documentation
    validations:
      required: true

  - type: dropdown
    id: criticality
    attributes:
      label: How would you describe the priority of this documentation request?
      options:
        - Critical (currently preventing usage)
        - High
        - Medium
        - Low (would be nice)
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Link or source to the relevant docs (if correcting)
      placeholder: "ex: https://github.com/NVIDIA-AI-Blueprints/llm-router/blob/v3-prefill/README.md"

  - type: textarea
    id: description
    attributes:
      label: Describe the issue or the documentation you'd like
      placeholder: The README says to use X, but the actual command is Y.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: (Optional) Proposed fix or content
      placeholder: Replace the command on line 42 with ...
