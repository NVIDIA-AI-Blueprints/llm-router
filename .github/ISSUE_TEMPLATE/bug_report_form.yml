name: Bug Report
description: File a bug report for the LLM Router
title: "[BUG]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of LLM Router are you running?
      placeholder: "example: 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: installation-method
    attributes:
      label: Which installation method(s) does this occur on?
      multiple: true
      options:
        - Docker
        - Pip
        - Source

  - type: dropdown
    id: branch
    attributes:
      label: Which branch are you using?
      options:
        - v3-prefill
        - experimental
        - main
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug.
      description: Also tell us, what did you expect to happen?
      placeholder: XYZ occurred, I expected QRS results
    validations:
      required: true

  - type: textarea
    id: mvr
    attributes:
      label: Minimum reproducible example
      description: Please supply a minimum reproducible code example here
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please paste relevant error and log output here
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: "OS, Python version, GPU (if applicable), CUDA version"
      placeholder: "Ubuntu 22.04, Python 3.10, NVIDIA A100, CUDA 12.4"

  - type: textarea
    id: misc
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
